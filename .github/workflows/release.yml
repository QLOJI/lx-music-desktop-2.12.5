  # ============================================================
  # Windows
  # ============================================================
  Windows_build:
    name: Windows Build
    runs-on: windows-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:win:7z:x64
          npm run publish:win:7z:arm64
          npm run publish:win:setup:arm64
          npm run publish:win:setup:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

      - name: Collect artifact list
        id: list
        shell: pwsh
        run: |
          $files = Get-ChildItem build\* -File -Include *.exe,*.7z
          $json = @($files | ForEach-Object { $_.Name }) | ConvertTo-Json -Compress
          if ($files.Count -eq 0) { $json = "[]" }
          echo "files=$json" >> $env:GITHUB_ENV
          echo "files=$json" >> $env:GITHUB_OUTPUT

      # 中间 artifact：把整个 build 目录传出来供上传 job 使用
      - name: Upload raw build (staging)
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: windows-staging
          path: build/
          if-no-files-found: warn
          retention-days: 1

  Windows_upload:
    name: Windows Upload (${{ matrix.file }})
    needs: Windows_build
    if: needs.Windows_build.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Windows_build.outputs.files) }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error

  # ============================================================
  # Windows_7
  # ============================================================
  Windows_7_build:
    name: Windows_7 Build
    runs-on: windows-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Prepare win7 undici env
        run: |
          npm install undici@5
          Set-Content -Path .\src\common\utils\request.ts -Value "export * from './request_node16'"

      - name: Build src code
        env:
          BUILD_WIN7: true
        run: |
          git status --porcelain
          npm run build

      - name: Prepare win7 electron env
        run: |
          npm install electron@22
          pip.exe install setuptools

      - name: Release win7 package
        run: |
          npm run publish:win7:setup:x64
          npm run publish:win7:7z:x64
          npm run publish:win7:7z:x86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 | Format-List

      - name: Collect artifact list
        id: list
        shell: pwsh
        run: |
          $files = Get-ChildItem build\* -File -Include *.exe,*.7z
          $json = @($files | ForEach-Object { $_.Name }) | ConvertTo-Json -Compress
          if ($files.Count -eq 0) { $json = "[]" }
          echo "files=$json" >> $env:GITHUB_OUTPUT

      - name: Upload raw build (staging)
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: windows7-staging
          path: build/
          if-no-files-found: warn
          retention-days: 1

  Windows_7_upload:
    name: Windows_7 Upload (${{ matrix.file }})
    needs: Windows_7_build
    if: needs.Windows_7_build.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Windows_7_build.outputs.files) }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: windows7-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows7-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error

  # ============================================================
  # Mac
  # ============================================================
  Mac_build:
    name: Mac Build
    runs-on: macos-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install python3 setuptools
        run: brew install python-setuptools

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:mac:dmg
          npm run publish:mac:dmg:arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          md5 *.dmg

      - name: Collect artifact list
        id: list
        shell: bash
        run: |
          files=$(ls build/*.dmg 2>/dev/null | xargs -r -n1 basename | jq -R . | jq -sc .)
          [ -z "$files" ] && files="[]"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload raw build (staging)
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: mac-staging
          path: build/
          if-no-files-found: warn
          retention-days: 1

  Mac_upload:
    name: Mac Upload (${{ matrix.file }})
    needs: Mac_build
    if: needs.Mac_build.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Mac_build.outputs.files) }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error

  # ============================================================
  # Linux
  # ============================================================
  Linux_build:
    name: Linux Build
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Install package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:linux:deb:amd64
          npm run publish:linux:deb:arm64
          npm run publish:linux:deb:armv7l
          npm run publish:linux:appImage
          npm run publish:linux:rpm
          npm run publish:linux:pacman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          md5sum *.deb *.rpm *.pacman *.AppImage

      - name: Collect artifact list
        id: list
        shell: bash
        run: |
          files=$(ls build/*.deb build/*.rpm build/*.pacman build/*.AppImage 2>/dev/null | xargs -r -n1 basename | jq -R . | jq -sc .)
          [ -z "$files" ] && files="[]"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Upload raw build (staging)
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: linux-staging
          path: build/
          if-no-files-found: warn
          retention-days: 1

  Linux_upload:
    name: Linux Upload (${{ matrix.file }})
    needs: Linux_build
    if: needs.Linux_build.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Linux_build.outputs.files) }}
    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error
