  # ============================================================
  # Windows
  # ============================================================
  Windows:
    name: Windows
    runs-on: windows-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:win:7z:x64
          npm run publish:win:7z:arm64
          npm run publish:win:setup:arm64
          npm run publish:win:setup:x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 -ErrorAction SilentlyContinue | Format-List

      - name: Collect artifact list
        id: list
        shell: pwsh
        run: |
          $files = @(Get-ChildItem build\* -File -Include *.exe,*.7z -ErrorAction SilentlyContinue)
          if ($files.Count -gt 0) {
            $json = @($files | ForEach-Object { $_.Name }) | ConvertTo-Json -Compress
          } else {
            $json = "[]"
          }
          Write-Host "Collected: $json"
          echo "files=$json" >> $env:GITHUB_OUTPUT

      - name: Upload staging
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: windows-staging
          path: build/
          retention-days: 1

  Windows_upload:
    name: Windows Upload (${{ matrix.file }})
    needs: Windows
    if: needs.Windows.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Windows.outputs.files) }}
    steps:
      - name: Download staging
        uses: actions/download-artifact@v4
        with:
          name: windows-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error

  # ============================================================
  # Windows_7
  # ============================================================
  Windows_7:
    name: Windows_7
    runs-on: windows-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: pwsh
        run: echo "NPM_CACHE=$(npm config get cache)" >> $env:GITHUB_ENV

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Prepare win7 undici env
        run: |
          npm install undici@5
          Set-Content -Path .\src\common\utils\request.ts -Value "export * from './request_node16'"

      - name: Build src code
        env:
          BUILD_WIN7: true
        run: |
          git status --porcelain
          npm run build

      - name: Prepare win7 electron env
        run: |
          npm install electron@22
          pip.exe install setuptools

      - name: Release win7 package
        run: |
          npm run publish:win7:setup:x64
          npm run publish:win7:7z:x64
          npm run publish:win7:7z:x86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          Get-FileHash *.exe,*.7z -Algorithm MD5 -ErrorAction SilentlyContinue | Format-List

      - name: Collect artifact list
        id: list
        shell: pwsh
        run: |
          $files = @(Get-ChildItem build\* -File -Include *.exe,*.7z -ErrorAction SilentlyContinue)
          if ($files.Count -gt 0) {
            $json = @($files | ForEach-Object { $_.Name }) | ConvertTo-Json -Compress
          } else {
            $json = "[]"
          }
          Write-Host "Collected: $json"
          echo "files=$json" >> $env:GITHUB_OUTPUT

      - name: Upload staging
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: windows7-staging
          path: build/
          retention-days: 1

  Windows_7_upload:
    name: Windows_7 Upload (${{ matrix.file }})
    needs: Windows_7
    if: needs.Windows_7.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Windows_7.outputs.files) }}
    steps:
      - name: Download staging
        uses: actions/download-artifact@v4
        with:
          name: windows7-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows7-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error

  # ============================================================
  # Mac
  # ============================================================
  Mac:
    name: Mac
    runs-on: macos-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install python3 setuptools
        run: brew install python-setuptools

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:mac:dmg
          npm run publish:mac:dmg:arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          md5 *.dmg 2>/dev/null || true

      - name: Collect artifact list
        id: list
        shell: bash
        run: |
          shopt -s nullglob
          names=()
          for f in build/*.dmg; do
            names+=("$(basename "$f")")
          done
          if [ ${#names[@]} -gt 0 ]; then
            json="["
            for n in "${names[@]}"; do
              esc=$(printf '%s' "$n" | sed 's/\\/\\\\/g; s/"/\\"/g')
              json="${json}\"${esc}\","
            done
            json="${json%,}]"
          else
            json="[]"
          fi
          echo "Collected: $json"
          echo "files=$json" >> "$GITHUB_OUTPUT"

      - name: Upload staging
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: mac-staging
          path: build/
          retention-days: 1

  Mac_upload:
    name: Mac Upload (${{ matrix.file }})
    needs: Mac
    if: needs.Mac.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Mac.outputs.files) }}
    steps:
      - name: Download staging
        uses: actions/download-artifact@v4
        with:
          name: mac-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error

  # ============================================================
  # Linux
  # ============================================================
  Linux:
    name: Linux
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - name: Install package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Get npm cache directory
        shell: bash
        run: echo "NPM_CACHE=$(npm config get cache)" >> $GITHUB_ENV

      - name: Show Env
        run: echo "${{ env.NPM_CACHE }}"

      - name: Setup Node Env
        env:
          NPM_CACHE: ${{ env.NPM_CACHE }}
        uses: ./.github/actions/setup

      - name: Build src code
        run: |
          git status --porcelain
          npm run build

      - name: Release package
        run: |
          npm run publish:linux:deb:amd64
          npm run publish:linux:deb:arm64
          npm run publish:linux:deb:armv7l
          npm run publish:linux:appImage
          npm run publish:linux:rpm
          npm run publish:linux:pacman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BT_TOKEN: ${{ secrets.BT_TOKEN }}

      - name: Generate file MD5
        run: |
          cd build
          md5sum *.deb *.rpm *.pacman *.AppImage 2>/dev/null || true

      - name: Collect artifact list
        id: list
        shell: bash
        run: |
          shopt -s nullglob
          names=()
          for f in build/*.deb build/*.rpm build/*.pacman build/*.AppImage; do
            names+=("$(basename "$f")")
          done
          if [ ${#names[@]} -gt 0 ]; then
            json="["
            for n in "${names[@]}"; do
              esc=$(printf '%s' "$n" | sed 's/\\/\\\\/g; s/"/\\"/g')
              json="${json}\"${esc}\","
            done
            json="${json%,}]"
          else
            json="[]"
          fi
          echo "Collected: $json"
          echo "files=$json" >> "$GITHUB_OUTPUT"

      - name: Upload staging
        if: steps.list.outputs.files != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: linux-staging
          path: build/
          retention-days: 1

  Linux_upload:
    name: Linux Upload (${{ matrix.file }})
    needs: Linux
    if: needs.Linux.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.Linux.outputs.files) }}
    steps:
      - name: Download staging
        uses: actions/download-artifact@v4
        with:
          name: linux-staging
          path: build

      - name: Upload single artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.file }}
          path: build/${{ matrix.file }}
          if-no-files-found: error
